<button
  class="mark-complete{% if lesson.is_complete %} is-done{% endif %}"
  id="complete-btn"
  type="button"
  hx-post="/books/{{ lesson.book_id }}/lessons/{{ lesson.order_index }}/{% if lesson.is_complete %}incomplete{% else %}complete{% endif %}"
  hx-swap="outerHTML"
  hx-target="#complete-btn"
>{% if lesson.is_complete %}Completed &#10003;{% else %}Mark as completed{% endif %}</button>
