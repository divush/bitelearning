{% extends "base.html" %}
{% block title %}Add a book · BiteLearning{% endblock %}
{% block content %}
<div class="book-header">
  <div><h1>Add a book</h1></div>
</div>

{% if error %}
<p class="form-error">{{ error }}</p>
{% endif %}

<form class="add-book-form" method="post" action="/books" enctype="multipart/form-data">
  <label class="field">
    <span class="field-label">PDF file</span>
    <input type="file" name="pdf" accept="application/pdf" required />
  </label>
  <label class="field">
    <span class="field-label">Title <span class="field-hint">(optional &mdash; defaults to the filename)</span></span>
    <input type="text" name="title" placeholder="e.g. Designing Data-Intensive Applications" />
  </label>
  <button class="mark-complete" type="submit">Add book</button>
</form>
{% endblock %}
